<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登入・敬拜 PPT 產生器</title>
  <link rel="icon" href="/static/icon.svg?v={{ asset_v }}" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css?v={{ asset_v }}">
  <script src="/static/theme.js?v={{ asset_v }}"></script>
</head>
<body class="login-body">
<main class="login">
  <div class="eyebrow">⛪ 敬拜 PPT 產生器</div>
  <h1>一起來做這週的 PPT</h1>
  <p class="muted">請輸入敬拜團的團隊密碼。忘記的話，請問負責開這個網址的同工。</p>
  {% if error %}<div class="banner error"><b>✕</b><span>{{ error }}</span></div>{% endif %}
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="next" value="{{ next or '/' }}">
    <div class="ffield">
      <label for="name">你的名字</label>
      <input type="text" id="name" name="name" maxlength="20" autocomplete="nickname" placeholder="例：暘恩" value="{{ name or '' }}">
      <span class="help">別人會看到「誰改了哪首歌」，方便互相對一下。</span>
    </div>
    <div class="ffield">
      <label for="password">團隊密碼</label>
      <input type="password" id="password" name="password" autocomplete="current-password" autofocus required>
    </div>
    <button type="submit" class="btn btn-primary">登入</button>
  </form>
</main>
</body>
</html>
